name: Actualisation des Résultats en direct

on:
  # On le laisse en déclenchement manuel pour l'instant
  workflow_dispatch:
  # Le jour de l'élection, on décommentera la ligne ci-dessous pour lancer toutes les 5 mins :
  # schedule:
  #   - cron: '*/5 * * * *'

jobs:
  scrape-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Exécution du script des résultats
        run: |
          python scraper_results.py

      - name: Commit et push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add results_senate.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live results" && git pull --rebase origin main && git push)
